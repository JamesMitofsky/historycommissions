name: Validate

# Runs on every push to main (Sveltia CMS commits straight to main) and
# on every pull request. A red ✗ here is the loud signal that a CMS edit broke
# the build schema, with the offending commission and field named in the log.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both versions come from package.json (`packageManager` and
      # `engines.node`), the same pins Vercel builds with, so CI cannot pass on
      # a toolchain the deploy does not use.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commission content against the Zod schema
        run: pnpm validate:commissions
      - name: Build the site
        run: pnpm build
