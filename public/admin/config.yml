local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: settings
    label: Site Settings
    description: Site-wide content and misc fields. Edit these to update text across the whole site.
    editor:
      preview: false
    files:
      - name: general
        label: General Site Settings
        file: content/settings/general.json
        fields:
          - { label: Site Title, name: siteTitle, widget: string, hint: "Shown in the masthead, browser tab, footer and feeds" }
          - { label: Masthead Kicker, name: kicker, widget: string, hint: "Small uppercase line above the title (e.g. 'A digital archive')" }
          - { label: Meta Description, name: description, widget: text, hint: "Used for SEO and social sharing previews" }
          - label: Navigation Links
            name: nav
            widget: list
            label_singular: Link
            summary: "{{fields.label}} → {{fields.href}}"
            fields:
              - { label: Path, name: href, widget: string, hint: "e.g. /about or /" }
              - { label: Label, name: label, widget: string, hint: "Shown on wider screens" }
              - { label: Short Label, name: shortLabel, widget: string, hint: "Shown on small/mobile screens" }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Tagline, name: tagline, widget: string }
              - { label: Copyright Holder, name: copyrightHolder, widget: string, hint: "Name after the © year" }
          - label: Social Sharing Image
            name: og
            widget: object
            fields:
              - { label: Subtitle, name: subtitle, widget: string, hint: "Caption on the link-preview image" }
          - label: RSS Feeds
            name: feeds
            widget: object
            fields:
              - { label: Posts Feed Title, name: postsTitle, widget: string }
              - { label: Posts Feed Description, name: postsDescription, widget: text }
              - { label: Commissions Feed Title, name: commissionsTitle, widget: string }
              - { label: Commissions Feed Description, name: commissionsDescription, widget: text }
      - name: about
        label: About Page
        file: content/settings/about.json
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown, hint: "Main about text" }
          - { label: Contact / Maintainer, name: contact, widget: markdown, hint: "Shown in smaller text below the body. Use links for names and emails." }

  - name: posts
    label: Posts
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Attribution, name: imageAttribution, widget: string, required: false }
      - { label: Image Attribution URL, name: imageAttributionUrl, widget: string, required: false }
      - label: Body
        name: body
        widget: richtext
        modes: [rich_text]
        editor_components: [image]
        buttons: ["bold", "italic", "strikethrough", "link", "heading-one", "heading-two", "heading-three", "heading-four", "quote", "bulleted-list", "numbered-list"]

  - name: commissions
    editor:
      preview: false
    label: Commissions
    folder: content/commissions
    create: true
    format: json
    extension: json
    slug: "{{slug}}"
    summary: "{{name.englishName}}"
    fields:
      - label: Name
        name: name
        widget: object
        fields:
          - { label: Primary Name, name: englishName, widget: string }
          - label: Translations
            name: translations
            widget: list
            fields:
              - { label: Language Code, name: language, widget: string, hint: "e.g. en, de, fr" }
              - { label: Name, name: name, widget: string }
      - { label: Proposed Date, name: proposedDate, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Use Jan 1 if only the year is known." }
      - { label: Start Date, name: startDate, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Use Jan 1 if only the year is known." }
      - { label: Last Active Status Date, name: lastActiveStatusDate, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Use Jan 1 if only the year is known." }
      - label: Last Active Status
        name: lastActiveStatus
        widget: select
        options: [ongoing, concluded, dormant, unknown]
        required: false
      - { label: Member Countries, name: memberCountries, widget: list }
      - { label: Sponsoring Institutions, name: sponsoringInstitutions, widget: list, required: false }
      - { label: Key Topics, name: keyTopics, widget: list, required: false }
      - label: Publications
        name: publications
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Year, name: year, widget: string, required: false }
          - { label: URL, name: url, widget: string, required: false }
          - label: Format
            name: format
            widget: select
            options: [monograph, proceedings, report, textbook_review, teaching_material, other]
            required: false
      - { label: Working Groups, name: workingGroups, widget: list, required: false }
      - label: Status
        name: status
        widget: select
        options: [active, dormant, ended, unknown]
      - label: Chairs
        name: chairs
        widget: list
        required: false
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Country, name: country, widget: string }
          - { label: Affiliation, name: affiliation, widget: string, required: false }
      - { label: Commission URL, name: url, widget: string, required: false }
      - label: Link Status
        name: linkStatus
        widget: select
        options: [working, broken, to_be_located]
      - { label: Last Archived Snapshot, name: lastArchivedSnapshot, widget: string, required: false }
      - label: Archivable Documents
        name: archivableDocuments
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Draft, name: draft, widget: boolean, required: false }

